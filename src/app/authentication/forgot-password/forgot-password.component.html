<div class="page responsive-log login-bg">
  <div class="page-single">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7 col-xl-5 col-xxl-4">
          <div class="card custom-card my-4">
            <div class="p-4 pb-0 text-center">
              <h2 class="mb-2">Recuperar Contraseña</h2>
              <p class="text-muted mb-0">Ingresa tu email para recibir instrucciones</p>
            </div>

            @if (!submitted) {
              <form class="card-body pb-3" [formGroup]="forgotForm" (ngSubmit)="submit()">
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <div class="input-group mb-3">
                    <span class="input-group-text">
                      <i class="fe fe-mail"></i>
                    </span>
                    <input class="form-control" type="email" formControlName="email"
                      placeholder="tu@email.com" autocomplete="email">
                  </div>
                </div>

                <div class="submit d-grid">
                  <button class="btn btn-primary" type="submit"
                    [disabled]="forgotForm.invalid || isSubmitting">
                    @if (isSubmitting) {
                      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                    }
                    Enviar Instrucciones
                  </button>
                </div>

                <div class="text-center mt-3">
                  <a routerLink="/auth/login" class="text-muted">Volver al login</a>
                </div>
              </form>
            } @else {
              <div class="card-body pb-3 text-center">
                <div class="mb-3">
                  <span class="avatar avatar-xl avatar-rounded bg-success-transparent">
                    <i class="fe fe-check-circle fs-2 text-success"></i>
                  </span>
                </div>
                <p class="text-muted">
                  Si el email existe, recibirás instrucciones para recuperar tu contraseña.
                </p>
                <div class="d-grid mt-3">
                  <a routerLink="/auth/login" class="btn btn-primary">Volver al Login</a>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
