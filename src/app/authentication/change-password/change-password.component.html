<div class="page responsive-log login-bg">
  <div class="page-single">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7 col-xl-5 col-xxl-4">
          <div class="card custom-card my-4">
            <div class="p-4 pb-0 text-center">
              <h2 class="mb-2">Cambiar Contraseña</h2>
              <p class="text-muted mb-0">Ingresa tu contraseña actual y la nueva contraseña</p>
            </div>
            <form class="card-body pb-3" [formGroup]="changePasswordForm" (ngSubmit)="submit()">
              <!-- Current Password -->
              <div class="form-group">
                <label class="form-label">Contraseña Actual</label>
                <div class="input-group mb-3">
                  <span class="input-group-text" (click)="toggleCurrentPassword()" style="cursor: pointer;">
                    <i class="fe" [ngClass]="showCurrentPassword ? 'fe-eye' : 'fe-eye-off'"></i>
                  </span>
                  <input class="form-control" [type]="showCurrentPassword ? 'text' : 'password'"
                    formControlName="currentPassword" placeholder="Contraseña actual" autocomplete="current-password">
                </div>
              </div>

              <!-- New Password -->
              <div class="form-group">
                <label class="form-label">Nueva Contraseña</label>
                <div class="input-group mb-1">
                  <span class="input-group-text" (click)="toggleNewPassword()" style="cursor: pointer;">
                    <i class="fe" [ngClass]="showNewPassword ? 'fe-eye' : 'fe-eye-off'"></i>
                  </span>
                  <input class="form-control" [type]="showNewPassword ? 'text' : 'password'"
                    formControlName="newPassword" placeholder="Nueva contraseña" autocomplete="new-password">
                </div>
                <app-password-strength [password]="newPasswordValue"></app-password-strength>
              </div>

              <!-- Confirm Password -->
              <div class="form-group mt-3">
                <label class="form-label">Confirmar Nueva Contraseña</label>
                <div class="input-group mb-1">
                  <span class="input-group-text" (click)="toggleConfirmPassword()" style="cursor: pointer;">
                    <i class="fe" [ngClass]="showConfirmPassword ? 'fe-eye' : 'fe-eye-off'"></i>
                  </span>
                  <input class="form-control" [type]="showConfirmPassword ? 'text' : 'password'"
                    formControlName="confirmPassword" placeholder="Confirmar nueva contraseña" autocomplete="new-password">
                </div>
                @if (passwordsDoNotMatch) {
                  <small class="text-danger">Las contraseñas no coinciden</small>
                }
              </div>

              <!-- Submit -->
              <div class="submit d-grid mt-3">
                <button class="btn btn-primary" type="submit"
                  [disabled]="changePasswordForm.invalid || passwordsDoNotMatch || isSubmitting">
                  @if (isSubmitting) {
                    <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                  }
                  Cambiar Contraseña
                </button>
              </div>

              <div class="text-center mt-3">
                <a routerLink="/home" class="text-muted">Volver al inicio</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
