<div class="container-fluid">
  <div class="row">
    <div class="col-xl-12">
      <div class="card custom-card">
        <div class="card-header justify-content-between">
          <div class="card-title">Reporte de Productos</div>
          <div class="d-flex gap-2">
            <button class="btn btn-danger btn-sm" (click)="exportarPDF()">
              <i class="ri-file-pdf-line"></i> PDF
            </button>
            <button class="btn btn-success btn-sm" (click)="exportarExcel()">
              <i class="ri-file-excel-line"></i> Excel
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-xl-12">
      <div class="card custom-card">
        <div class="card-header"><div class="card-title">Filtros</div></div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label">Tipo de Filtro</label>
              <select class="form-select" [(ngModel)]="tipoFiltro" (change)="onTipoFiltroChange()">
                <option value="dia">Por Día</option>
                <option value="mes">Por Mes</option>
                <option value="rango">Rango de Fechas</option>
              </select>
            </div>
            @if (tipoFiltro === 'dia') {
              <div class="col-md-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" [(ngModel)]="fechaSeleccionada">
              </div>
            }
            @if (tipoFiltro === 'mes') {
              <div class="col-md-3">
                <label class="form-label">Mes</label>
                <select class="form-select" [(ngModel)]="mesSeleccionado">
                  @for (mes of meses; track mes.value) {
                    <option [value]="mes.value">{{ mes.label }}</option>
                  }
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Año</label>
                <select class="form-select" [(ngModel)]="anioSeleccionado">
                  @for (anio of anios; track anio) {
                    <option [value]="anio">{{ anio }}</option>
                  }
                </select>
              </div>
            }
            @if (tipoFiltro === 'rango') {
              <div class="col-md-3">
                <label class="form-label">Desde</label>
                <input type="date" class="form-control" [(ngModel)]="fechaDesde">
              </div>
              <div class="col-md-3">
                <label class="form-label">Hasta</label>
                <input type="date" class="form-control" [(ngModel)]="fechaHasta">
              </div>
            }
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-primary w-100" (click)="loadReport()" [disabled]="isLoading">
                @if (isLoading) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                }
                <i class="ri-bar-chart-line"></i> Generar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  @if (estadisticas && !isLoading) {
    <div class="row">
      <div class="col-xl-12">
        <div class="card custom-card">
          <div class="card-header"><div class="card-title">Estadísticas de Productos</div></div>
          <div class="card-body">
            <pre>{{ estadisticas | json }}</pre>
          </div>
        </div>
      </div>
    </div>
  }

  @if (isLoading) {
    <div class="row">
      <div class="col-xl-12">
        <div class="card custom-card">
          <div class="card-body text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3">Generando reporte...</p>
          </div>
        </div>
      </div>
    </div>
  }
</div>
